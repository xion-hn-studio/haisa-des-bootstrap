name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# -----------------------------------------------------------
# bootstrap 仓库 CI
#
# 设计：构建和发布合并在同一 job，避免 artifact 中转（配额受限时不可靠）。
#   - bootstrap (prod): 构建 + 产 artifact + tag 触发时直接 gh release upload
#   - bootstrap (test): 构建 + 产 artifact（Termux 冒烟测试用）
#
# 资源流转（tag 触发）：
#   prod job 构建 → 直接上传到 haisa-des-repo Releases
#   haisa-des 软件 CI → 从 Releases latest/download/ 拉 bootstrap.zip
#   App 端 → 从 Releases latest/download/ 拉 packages.json / bootstrap-version.json
# -----------------------------------------------------------

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          # 注意：不在此调用 make-bootstrap.sh，留作最终打包步骤（见下）。

      # 全部 4 个 wheel（numpy/Pillow/lxml/pygame）统一用 download 方法：
      # 从 PyPI 拉 aarch64 manylinux wheel（纯下载，无编译）。
      # pygame 2.6.1 起官方发 cp313 aarch64 manylinux wheel，与 numpy/Pillow/lxml 同机制，
      # 无需 source 交叉编译，避开 QEMU binfmt 无法运行 Android 动态链接 python3 的限制。
      - name: Build wheels (download method, prod only)
        if: matrix.variant == 'prod'
        env:
          VARIANT: prod
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          # 构建 ALL_WHEELS（39 个 download 方法 wheel）
          ./wheels/build-wheels.sh build all
          ./make-wheels-index.sh

      # make-bootstrap 是最终打包步骤：会删除 staging 符号链接。
      # 全部 wheel 用 download 方法后不再依赖 staging python3，但 make-bootstrap 仍需
      # 放在 build all 之后（要打包 staging 内容）。test variant 直接在此打包。
      - name: Make bootstrap
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cd build-system
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Generate bootstrap version json (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-bootstrap-version.sh

      - name: Upload bootstrap artifacts (CI 内调试用)
        continue-on-error: true   # 配额耗尽时不阻塞（产物仍可 push 到 Releases）
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
            build-system/dist/packages.json
            build-system/dist/bootstrap-version.json
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------
      # tag 触发：prod job 直接上传到 haisa-des-repo Releases
      # 与构建在同一 job 内，不依赖 artifact 中转（配额受限时更可靠）
      # -----------------------------------------------------------
      - name: Publish to haisa-des-repo Releases
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'prod'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "错误: secrets.RELEASE_REPO_TOKEN 未配置（需 haisa-des-repo 的 PAT，contents:write 权限）"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"
          cd build-system/dist

          echo "=== 待上传资产 ==="
          ls -la bootstrap-arm64-v8a.zip packages.json bootstrap-version.json packages/*.tar.gz wheels/*.whl wheels-index.json

          # 检查 release 是否已存在；不存在则创建（草稿，避免半成品暴露）
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "创建 release $TAG on $REPO"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "bootstrap $TAG" \
              --notes "bootstrap release $TAG

          由 haisa-des-bootstrap CI 自动发布。
          - bootstrap-arm64-v8a.zip: 完整 bootstrap（含 Python 3.13 + pip + 21 个原生包）
          - packages.json: 包索引（App 端 PM 用）
          - bootstrap-version.json: bootstrap 版本信息（App 端 OTA 升级用）
          - packages/*.tar.gz: 单独包归档（按需安装）
          - wheels/*.whl: 39 个 wheel（numpy/pandas/scipy/pygame/ujson 等常用库，pip install 用）
          - wheels-index.json: wheel 索引（App 端 PM 用）" \
              --draft
          fi

          # 上传资产（同名会覆盖，便于重试）
          # prod 变体已构建全部 39 个 wheel + wheels-index.json
          gh release upload "$TAG" --repo "$REPO" \
            bootstrap-arm64-v8a.zip \
            packages.json \
            bootstrap-version.json \
            packages/*.tar.gz \
            wheels/*.whl \
            wheels-index.json \
            --clobber

          # 发布（去 draft）+ 标记为 latest（确保 releases/latest/download/ 指向最新版）
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest

          echo "✓ 已发布 $TAG 到 $REPO"
          echo "  下载链接（公开）:"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-arm64-v8a.zip"
          echo "    https://github.com/$REPO/releases/latest/download/packages.json"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-version.json"

  # -----------------------------------------------------------
  # wheels job：仅 push to main 时跑，快速验证 download 方法的 wheel URL 仍可用
  # tag 触发时跳过 —— prod job 已构建全部 4 个 wheel（numpy/Pillow/lxml/pygame）并发布
  # -----------------------------------------------------------
  wheels:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels (download method)
        run: |
          cd build-system
          # 构建 ALL_WHEELS（39 个 download 方法 wheel），验证 PyPI URL 可达
          ./wheels/build-wheels.sh build all

      - name: Upload wheels artifacts (CI 内调试用)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            build-system/dist/wheels/*.whl
          if-no-files-found: warn
          retention-days: 7
