name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# -----------------------------------------------------------
# bootstrap 仓库 CI
#
# 设计：构建和发布合并在同一 job，避免 artifact 中转（配额受限时不可靠）。
#   - bootstrap (prod): 构建 + 产 artifact + tag 触发时直接 gh release upload
#   - bootstrap (test): 构建 + 产 artifact（Termux 冒烟测试用）
#
# 资源流转（tag 触发）：
#   prod job 构建 → 直接上传到 haisa-des-repo Releases
#   haisa-des 软件 CI → 从 Releases latest/download/ 拉 bootstrap.zip
#   App 端 → 从 Releases latest/download/ 拉 packages.json / bootstrap-version.json
# -----------------------------------------------------------

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      # openjdk-17 包用 patchelf 重写 ELF 的 RPATH（Termux prefix → haisa-des prefix）
      # ubuntu-latest 默认未装 patchelf，需显式安装
      - name: Install patchelf (for openjdk-17 RPATH rewrite)
        run: sudo apt-get install -y patchelf

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          # 注意：不在此调用 make-bootstrap.sh，留作最终打包步骤（见下）。

      # 全部 4 个 wheel（numpy/Pillow/lxml/pygame）统一用 download 方法：
      # 从 PyPI 拉 aarch64 manylinux wheel（纯下载，无编译）。
      # pygame 2.6.1 起官方发 cp313 aarch64 manylinux wheel，与 numpy/Pillow/lxml 同机制，
      # 无需 source 交叉编译，避开 QEMU binfmt 无法运行 Android 动态链接 python3 的限制。
      - name: Build wheels (download method, prod only)
        if: matrix.variant == 'prod'
        env:
          VARIANT: prod
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          # 构建 ALL_WHEELS（39 个 download 方法 wheel）
          ./wheels/build-wheels.sh build all
          ./make-wheels-index.sh

      # make-bootstrap 是最终打包步骤：会删除 staging 符号链接。
      # 全部 wheel 用 download 方法后不再依赖 staging python3，但 make-bootstrap 仍需
      # 放在 build all 之后（要打包 staging 内容）。test variant 直接在此打包。
      - name: Make bootstrap
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cd build-system
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Generate apt-repo + pip-repo (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          # 1. apt-repo：扫描 dist/packages/*.deb 生成 Debian 仓库元数据
          #    pool 按首字母布局: pool/main/<首字母>/<包名>/<deb>
          ./make-apt-repo.sh
          # 2. pip-repo：扫描 dist/wheels/*.whl 生成 PEP 503 simple 索引
          #    simple/<首字母>/<规范化包名>/index.html
          ./make-pip-repo.sh

      - name: Sign apt Release (prod only)
        if: matrix.variant == 'prod'
        env:
          HAISADES_GPG_PRIVATE_KEY: ${{ secrets.HAISADES_GPG_PRIVATE_KEY }}
        run: |
          cd build-system
          # 从 GitHub Secret 注入 GPG 私钥，签名 Release 生成 InRelease + Release.gpg
          if [ -z "$HAISADES_GPG_PRIVATE_KEY" ]; then
            echo "::warning::HAISADES_GPG_PRIVATE_KEY 未设置，Release 未签名（设备端 apt update 会因签名校验失败）"
            exit 0
          fi
          printf '%s' "$HAISADES_GPG_PRIVATE_KEY" | ./make-keyring.sh import-private
          ./make-keyring.sh sign dist/apt-repo/dists/stable/Release

      - name: Generate bootstrap version json (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-bootstrap-version.sh

      - name: Upload bootstrap artifacts (CI 内调试用)
        continue-on-error: true   # 配额耗尽时不阻塞（产物仍可 push 到 Releases）
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.deb
            build-system/dist/packages.json
            build-system/dist/bootstrap-version.json
            build-system/dist/apt-repo/
            build-system/dist/pip-repo/
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------
      # tag 触发：按首字母上传资产到 haisa-des-repo 的 26 个 release（pip-a ~ pip-z）
      #
      # 设计:
      #   - 所有资产（.whl / .deb / .zip / .tar.gz / .json）按首字母归到对应 release
      #   - 同名资产 --clobber 覆盖（保证最新版本）
      #   - apt-repo/ 和 pip-repo/ 元数据不上传，由 organize workflow 自动生成
      #   - 上传完成后触发 organize workflow（repository_dispatch）整理 gh-pages 索引
      #
      # 首字母规则（与 organize-repo.sh 一致）:
      #   - 提取文件名第一段（- 或 _ 分割）
      #   - 规范化（小写，-_. 合并为 -）
      #   - 取首字母 → pip-<letter>
      # -----------------------------------------------------------
      - name: Publish assets to haisa-des-repo (by first letter)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'prod'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.RELEASE_REPO_TOKEN 未配置（需 haisa-des-repo 的 PAT，contents:write 权限）"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"
          DIST="$GITHUB_WORKSPACE/build-system/dist"

          echo "=== 待上传资产 ==="
          ls -la "$DIST"/{bootstrap-*.zip,packages.json,bootstrap-version.json,wheels-index.json} 2>/dev/null || true
          ls -1 "$DIST/packages/"*.deb 2>/dev/null | head -5 || true
          echo "  .deb 总数: $(ls -1 "$DIST/packages/"*.deb 2>/dev/null | wc -l)"
          ls -1 "$DIST/wheels/"*.whl 2>/dev/null | head -5 || true
          echo "  .whl 总数: $(ls -1 "$DIST/wheels/"*.whl 2>/dev/null | wc -l)"

          # 首字母计算函数（与 organize-repo.sh 一致）
          get_letter() {
            local name="$1"
            local base="${name%.*}"       # 去扩展名
            base="${base%.tar}"            # 处理 .tar.gz
            local first_seg="${base%%[-_]*}"  # 取第一段
            # 规范化：大写转小写，连续 -_. 合并
            first_seg=$(echo "$first_seg" | tr '[:upper:]' '[:lower:]' | tr '._' '-')
            first_seg=$(echo "$first_seg" | sed 's/--*/-/g')
            local letter="${first_seg:0:1}"
            [ -n "$letter" ] || letter="_"
            echo "$letter"
          }

          # 确保 26 个 release 都存在（不存在则创建）
          echo "=== 确保 26 个 release 存在 ==="
          for c in {a..z}; do
            tag="pip-$c"
            if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" \
                --title "Python packages - $c" \
                --notes "Assets starting with '$c'. Auto-maintained by haisa-des-bootstrap CI."
              echo "  创建 release $tag"
            fi
          done

          # 按首字母分发上传
          echo "=== 按首字母分发上传 ==="
          upload_file() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local letter
            letter="$(get_letter "$name")"
            local tag="pip-$letter"
            gh release upload "$tag" --repo "$REPO" "$file" --clobber
            echo "  $name → $tag"
          }

          # 上传所有资产
          for f in "$DIST"/bootstrap-*.zip "$DIST"/packages.json "$DIST"/bootstrap-version.json "$DIST"/wheels-index.json; do
            [ -f "$f" ] || continue
            upload_file "$f"
          done
          for f in "$DIST/packages/"*.deb; do
            [ -f "$f" ] || continue
            upload_file "$f"
          done
          for f in "$DIST/wheels/"*.whl; do
            [ -f "$f" ] || continue
            upload_file "$f"
          done

          echo ""
          echo "✓ 已上传资产到 $REPO（按首字母分发到 pip-a ~ pip-z）"
          echo "  bootstrap: $TAG"
          echo "  latest download:"
          echo "    https://github.com/$REPO/releases/download/pip-b/bootstrap-arm64-v8a.zip"
          echo "    https://github.com/$REPO/releases/download/pip-p/packages.json"
          echo "    https://github.com/$REPO/releases/download/pip-b/bootstrap-version.json"

      # -----------------------------------------------------------
      # tag 触发：调用 repository_dispatch 触发 haisa-des-repo 的 organize workflow
      # organize workflow 会自动扫描 26 个 release、生成 apt + pip 索引、部署到 gh-pages
      # -----------------------------------------------------------
      - name: Trigger haisa-des-repo organize workflow
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'prod'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.RELEASE_REPO_TOKEN 未配置"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"
          echo "触发 $REPO 的 organize-repo repository_dispatch..."

          gh api "repos/$REPO/dispatches" \
            -f event_type='organize-repo' \
            -f "client_payload[release_tag]=$TAG" \
            -f "client_payload[source_repo]=${{ github.repository }}"

          echo "✓ 已触发 organize workflow（event_type=organize-repo, release_tag=$TAG）"
          echo "  organize workflow 会自动:"
          echo "    1. 扫描所有 release（pip-a ~ pip-z）"
          echo "    2. 生成 apt Packages + Release"
          echo "    3. 生成 PEP 503 simple 索引"
          echo "    4. 部署到 gh-pages 分支"
          echo ""
          echo "  GitHub Pages URL（部署后）:"
          echo "    apt: https://xion-hn.github.io/haisa-des-repo/apt-repo/dists/stable/Release"
          echo "    pip: https://xion-hn.github.io/haisa-des-repo/pip-repo/simple/"

      # -----------------------------------------------------------
      # tag 触发：触发 haisa-des APK CI 构建 APK
      # APK CI 依赖 bootstrap.zip，必须等 bootstrap 上传完成后才能构建
      # （之前 APK CI 和 bootstrap CI 同时触发，APK CI 1分钟完成时 bootstrap 还没上传，
      #   导致 APK 内嵌旧版 bootstrap.zip）
      # -----------------------------------------------------------
      - name: Trigger haisa-des APK CI
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'prod'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::secrets.RELEASE_REPO_TOKEN 未配置，跳过触发 APK CI"
            exit 0
          fi

          REPO="xion-hn-studio/haisa-des"
          echo "触发 $REPO 的 bootstrap-ready repository_dispatch（tag=$TAG）..."

          gh api "repos/$REPO/dispatches" \
            -f event_type='bootstrap-ready' \
            -f "client_payload[bootstrap_tag]=$TAG" \
            -f "client_payload[bootstrap_version]=${TAG#v}"

          echo "✓ 已触发 APK CI（event_type=bootstrap-ready）"
          echo "  APK CI 会:"
          echo "    1. 下载最新 bootstrap.zip（此时已是 v${TAG#v} 实体文件版本）"
          echo "    2. 构建 APK 并发布"

  # -----------------------------------------------------------
  # wheels job：仅 push to main 时跑，快速验证 download 方法的 wheel URL 仍可用
  # tag 触发时跳过 —— prod job 已构建全部 4 个 wheel（numpy/Pillow/lxml/pygame）并发布
  # -----------------------------------------------------------
  wheels:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels (download method)
        run: |
          cd build-system
          # 构建 ALL_WHEELS（39 个 download 方法 wheel），验证 PyPI URL 可达
          ./wheels/build-wheels.sh build all

      - name: Upload wheels artifacts (CI 内调试用)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            build-system/dist/wheels/*.whl
          if-no-files-found: warn
          retention-days: 7
