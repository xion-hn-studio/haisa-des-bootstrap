name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # 交叉编译：NDK r29 构建 14 个包 → bootstrap.zip + 单包 tar.gz + packages.json + bootstrap-version.json
  #
  # 仓库职责：
  #   - 本仓库（haisa-des-bootstrap）专注 bootstrap 源码构建
  #   - push 触发：产 artifact（7 天保留），供调试/下载
  #   - tag 触发：上传到 haisa-des-repo Releases，供 App 端 + haisa-des 软件 CI 拉取
  #
  # 资源流转：
  #   - tag 触发 → 本 CI 上传到 XION-HN/haisa-des-repo Releases
  #   - haisa-des 软件 CI → 从 Releases latest/download/ 拉 bootstrap.zip 注入 APK
  #   - App 端 → 从 Releases latest/download/ 拉 packages.json / bootstrap-version.json
  # -----------------------------------------------------------
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Generate bootstrap version json (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-bootstrap-version.sh

      - name: Upload bootstrap artifacts
        continue-on-error: true   # 配额耗尽时不阻塞 CI（产物仍会 push 到 Releases）
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
            build-system/dist/packages.json
            build-system/dist/bootstrap-version.json
          if-no-files-found: warn
          retention-days: 7

  # -----------------------------------------------------------
  # tag 触发：上传 bootstrap + packages.json + version.json 到公开发布仓库
  # 跨仓库 release 上传需 PAT（RELEASE_REPO_TOKEN secret，需 haisa-des-repo 的 contents:write 权限）
  # -----------------------------------------------------------
  publish:
    needs: [bootstrap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bootstrap-prod artifact
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-prod
          path: dist

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create release on haisa-des-repo and upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # 校验 token
          if [ -z "$GH_TOKEN" ]; then
            echo "错误: secrets.RELEASE_REPO_TOKEN 未配置（需 haisa-des-repo 的 PAT，contents:write 权限）"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"

          # 检查 release 是否已存在；不存在则创建（草稿，避免半成品暴露）
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "创建 release $TAG on $REPO"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "bootstrap $TAG" \
              --notes "bootstrap release $TAG

          由 haisa-des-bootstrap CI 自动发布。
          - bootstrap-arm64-v8a.zip: 完整 bootstrap（含 Python 3.13 + pip + 14 个原生包）
          - packages.json: 包索引（App 端 PM 用）
          - bootstrap-version.json: bootstrap 版本信息（App 端 OTA 升级用）
          - packages/*.tar.gz: 单独包归档（按需安装）" \
              --draft
          fi

          # 上传资产（同名会覆盖，便于重试）
          cd dist
          gh release upload "$TAG" --repo "$REPO" \
            bootstrap-arm64-v8a.zip \
            packages.json \
            bootstrap-version.json \
            packages/*.tar.gz \
            --clobber

          # 发布（去 draft）
          gh release edit "$TAG" --repo "$REPO" --draft=false

          echo "✓ 已发布 $TAG 到 $REPO"
          echo "  下载链接（公开）:"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-arm64-v8a.zip"
          echo "    https://github.com/$REPO/releases/latest/download/packages.json"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-version.json"
