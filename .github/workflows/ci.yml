name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# -----------------------------------------------------------
# bootstrap 仓库 CI
#
# 设计：构建和发布合并在同一 job，避免 artifact 中转（配额受限时不可靠）。
#   - bootstrap (prod): 构建 + 产 artifact + tag 触发时直接 gh release upload
#   - bootstrap (test): 构建 + 产 artifact（Termux 冒烟测试用）
#
# 资源流转（tag 触发）：
#   prod job 构建 → 直接上传到 haisa-des-repo Releases
#   haisa-des 软件 CI → 从 Releases latest/download/ 拉 bootstrap.zip
#   App 端 → 从 Releases latest/download/ 拉 packages.json / bootstrap-version.json
# -----------------------------------------------------------

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          ./make-bootstrap.sh

      - name: Generate packages index (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-packages-index.sh

      - name: Generate bootstrap version json (prod only)
        if: matrix.variant == 'prod'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-bootstrap-version.sh

      - name: Upload bootstrap artifacts (CI 内调试用)
        continue-on-error: true   # 配额耗尽时不阻塞（产物仍可 push 到 Releases）
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
            build-system/dist/packages.json
            build-system/dist/bootstrap-version.json
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------
      # tag 触发：prod job 直接上传到 haisa-des-repo Releases
      # 与构建在同一 job 内，不依赖 artifact 中转（配额受限时更可靠）
      # -----------------------------------------------------------
      - name: Publish to haisa-des-repo Releases
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'prod'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "错误: secrets.RELEASE_REPO_TOKEN 未配置（需 haisa-des-repo 的 PAT，contents:write 权限）"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"
          cd build-system/dist

          echo "=== 待上传资产 ==="
          ls -la bootstrap-arm64-v8a.zip packages.json bootstrap-version.json packages/*.tar.gz

          # 检查 release 是否已存在；不存在则创建（草稿，避免半成品暴露）
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "创建 release $TAG on $REPO"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "bootstrap $TAG" \
              --notes "bootstrap release $TAG

          由 haisa-des-bootstrap CI 自动发布。
          - bootstrap-arm64-v8a.zip: 完整 bootstrap（含 Python 3.13 + pip + 14 个原生包）
          - packages.json: 包索引（App 端 PM 用）
          - bootstrap-version.json: bootstrap 版本信息（App 端 OTA 升级用）
          - packages/*.tar.gz: 单独包归档（按需安装）" \
              --draft
          fi

          # 上传资产（同名会覆盖，便于重试）
          gh release upload "$TAG" --repo "$REPO" \
            bootstrap-arm64-v8a.zip \
            packages.json \
            bootstrap-version.json \
            packages/*.tar.gz \
            --clobber

          # 发布（去 draft）
          gh release edit "$TAG" --repo "$REPO" --draft=false

          echo "✓ 已发布 $TAG 到 $REPO"
          echo "  下载链接（公开）:"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-arm64-v8a.zip"
          echo "    https://github.com/$REPO/releases/latest/download/packages.json"
          echo "    https://github.com/$REPO/releases/latest/download/bootstrap-version.json"

  # -----------------------------------------------------------
  # wheels job（M3.1 B1 阶段）：拉取 PyPI aarch64 manywheel + 索引
  # 独立于 bootstrap job，可并行；不依赖 staging / QEMU
  #   - 仅 download 方法（numpy/Pillow/lxml）
  #   - pygame source 方法留到 B4（需 staging SDL2 + QEMU binfmt）
  # tag 触发时上传 wheels + wheels-index.json 到 Releases
  # -----------------------------------------------------------
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels (download method)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          # 仅跑 download 方法（pygame source 方法需 staging SDL2 + QEMU，B4 阶段启用）
          ./wheels/build-wheels.sh build numpy Pillow lxml

      - name: Generate wheels index
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build-system
          ./make-wheels-index.sh

      - name: Upload wheels artifacts (CI 内调试用)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            build-system/dist/wheels/*.whl
            build-system/dist/wheels-index.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish wheels to haisa-des-repo Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "错误: secrets.RELEASE_REPO_TOKEN 未配置"
            exit 1
          fi

          REPO="XION-HN/haisa-des-repo"
          cd build-system/dist

          echo "=== 待上传 wheel 资产 ==="
          ls -la wheels/*.whl wheels-index.json

          # release 应已被 bootstrap job 创建（同 tag）；若不存在则创建
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "bootstrap $TAG" \
              --notes "wheels release $TAG（由 wheels job 单独发布）" --draft
          fi

          gh release upload "$TAG" --repo "$REPO" \
            wheels/*.whl \
            wheels-index.json \
            --clobber

          gh release edit "$TAG" --repo "$REPO" --draft=false

          echo "✓ 已发布 wheels $TAG 到 $REPO"
          echo "  下载链接:"
          echo "    https://github.com/$REPO/releases/latest/download/wheels-index.json"
